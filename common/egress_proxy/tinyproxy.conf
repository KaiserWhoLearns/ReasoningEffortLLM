# tinyproxy config for the sealed task environment (common/sealed_docker.py); the policy it
# enforces is common/egress_proxy/allowlist.txt.
#
# The filter is matched against the destination host of every request, including the
# `CONNECT host:443` that opens an HTTPS tunnel, so HTTPS is filtered by hostname without
# terminating TLS.
User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 200
StartServers 5

# Log every request: `docker logs` on this container records what the agents tried to reach.
LogLevel Connect

# The proxy sits only on an --internal network, so this admits just the task containers on it.
Allow 0.0.0.0/0

# CONNECT only to the ports a package fetch needs.
ConnectPort 443
ConnectPort 80

Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive No
FilterURLs Off
